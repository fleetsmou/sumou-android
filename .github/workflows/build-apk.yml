name: Build Sumou Fleet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android build
        run: |
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/' android/variables.gradle
          sed -i 's/com.android.tools.build:gradle:8.0.0/com.android.tools.build:gradle:8.1.4/' android/build.gradle

      - name: Inject Sumou native tracker
        run: |
          PKG=android/app/src/main/java/com/sumou/fleet
          cp native-src/SumouTrackerPlugin.java "$PKG/SumouTrackerPlugin.java"
          cp native-src/SumouTrackerService.java "$PKG/SumouTrackerService.java"
          cp native-src/MainActivity.java "$PKG/MainActivity.java"
          printf "\ndependencies { implementation 'com.google.android.gms:play-services-location:21.0.1' }\n" >> android/app/build.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <service android:name="com.sumou.fleet.SumouTrackerService" android:exported="false" android:foregroundServiceType="location" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          echo "----- MainActivity -----"; cat "$PKG/MainActivity.java"
          echo "----- manifest -----"; cat android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sumou-fleet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
