name: Build Sumou Fleet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 11076708

      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Verify native tracker policy
        run: python3 tests/test-tracker-policy.py

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android build
        run: python3 scripts/configure-build.py

      - name: Inject Sumou native tracker
        run: python3 scripts/configure-native.py

      - name: Build test and unsigned release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: sumou-fleet-test-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: sumou-fleet-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
