name: Build Sumou Fleet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Transistorsoft maven repos
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              repositories {
                  maven { url "${project(':transistorsoft-capacitor-background-geolocation').projectDir}/libs" }
                  maven { url "${project(':transistorsoft-capacitor-background-fetch').projectDir}/libs" }
                  maven { url 'https://developer.huawei.com/repo/' }
              }
          }
          GRADLE
          tail -n 20 android/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sumou-fleet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
