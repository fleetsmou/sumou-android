<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumou Fleet</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#0f1b28;color:#fff;
      display:grid;place-items:center;height:100vh;text-align:center}
    .logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#13c78a,#0c8f63);
      display:grid;place-items:center;font-size:36px;margin:0 auto 16px}
    .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:#10b981;
      border-radius:50%;animation:s 1s linear infinite;margin:18px auto 0}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div>
    <div class="logo">🚚</div>
    <h2>SUMOU FLEET</h2>
    <p style="color:#8fa0b3">Loading your fleet app…</p>
    <div class="spin"></div>
  </div>
</body>
</html>
